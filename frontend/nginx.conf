server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # nginx 默认限制请求体最大 1MB，会导致稍大一点的 PDF/Word 文档上传失败（返回 413 错误），
    # 调大到 20MB 覆盖大多数文档场景
    client_max_body_size 20m;

    # 开发环境用的是 vite.config.js 里的代理转发 /api 和 /files 到后端，
    # 生产环境同样的道理，换成 nginx 来做这件事——
    # 前端页面本身访问 /api/xxx 时，请求实际是发给 nginx（80端口），
    # nginx 再把它转发给内部网络里的 backend 容器（docker-compose 里的服务名，8000端口）
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # 流式问答（SSE）需要关闭 nginx 的响应缓冲，否则打字机效果会变成"攒够一批才显示"
        proxy_buffering off;
        proxy_cache off;
    }

    location /files/ {
        proxy_pass http://backend:8000;
    }

    # 单页应用（SPA）路由：如果请求的路径不是真实存在的文件，一律返回 index.html，
    # 交给前端的 Vue Router 处理（虽然本项目目前没用路由，但这是标准配置，加上更规范）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
