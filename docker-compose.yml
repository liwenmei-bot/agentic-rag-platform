# 一键启动整个项目：docker compose up --build
#
# 编排了三个服务：
# - neo4j：知识图谱数据库
# - backend：FastAPI 后端（RAG + 图谱 + Agent 全部逻辑）
# - frontend：Vue 前端（nginx 提供静态文件 + 转发 API 请求）
#
# 配置来源：这个文件读取同目录下的 .env 文件（docker compose 会自动加载），
# 使用前先执行 cp .env.example .env，然后编辑 .env 填入真实的 API Key 等信息。

services:
  neo4j:
    image: neo4j:5.24
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build: ./backend
    environment:
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME}
      EMBEDDING_MODEL_NAME: BAAI/bge-small-zh-v1.5
      CHROMA_PERSIST_DIR: /app/data/chroma
      UPLOAD_DIR: /app/data/uploads
      CHUNK_SIZE: 500
      CHUNK_OVERLAP: 50
      TOP_K: 4
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      SERPER_API_KEY: ${SERPER_API_KEY}
    volumes:
      - backend_data:/app/data
    ports:
      - "8000:8000"
    depends_on:
      neo4j:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  neo4j_data:
  backend_data:
